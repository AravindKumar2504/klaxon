[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "klaxon"
version = "0.0.1"
description = "An AI on-call engineer for a payments system (in progress). So far: a synthetic payments patient, live in Docker Compose, and the money check."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# mcp: the official MCP SDK, only for tests that talk to Klaxon's own server as a real client would.
# 2.2.0 (2026-09-07), not 2.3.0: that one was under two weeks old (week 3).
dev = ["pytest>=8", "ruff>=0.16", "mcp==2.2.0"]
# The live patient services (week 1). Exact versions for the image: requirements/services.lock.txt
services = [
    "fastapi>=0.142",
    "uvicorn>=0.53",
    "httpx>=0.28",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "redis>=8.1",
    "confluent-kafka>=2.15",
    # Week 2: traces, metrics and logs, exported to grafana/otel-lgtm (FastAPI itself needs opentelemetry-api).
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-psycopg>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` runs only the offline tests. The others need Docker: make test-integration, make e2e.
addopts = "-m 'not integration and not e2e'"
markers = [
    "integration: needs the Compose stack's PostgreSQL and Kafka running (make up)",
    "e2e: resets the whole Compose stack and drives it end to end (make e2e)",
]
# Starlette 1.7 asks for a replacement HTTP client in its test client. Since week 3 the dev extra brings it
# (httpx2, through mcp), so this only matters in a venv without it. Revisit on upgrades.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP017: the first piece writes timezone.utc; keep one style.
# E501: ruff format wraps what it can; a long SQL string literal is clearer left whole.
ignore = ["UP017", "E501"]
