# Redis, as in compose.yaml: no persistence on purpose (PostgreSQL guards the idempotency keys), never evicts.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: klaxon
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: klaxon }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
# This Mac's 127.0.0.1:6379, as in compose.yaml (deploy/kind/cluster.yaml maps it to node port 30379).
apiVersion: v1
kind: Service
metadata:
  name: redis-host
  namespace: klaxon
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: klaxon }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379, nodePort: 30379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: klaxon
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: klaxon }
spec:
  replicas: 1
  strategy:
    type: Recreate # one Redis at a time, as Compose replaces a container: the old one stops first
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: klaxon }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:8.8.3-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
          ports:
            - { name: redis, containerPort: 6379 }
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 40
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
