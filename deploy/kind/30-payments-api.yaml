# The payments API, as in compose.yaml: our image, with the good settings (week 4's known-bad ones only ever come
# from a deploy). It starts after PostgreSQL, Redis and the fake provider are ready (make kind-up waits for them).
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: klaxon
  labels: { app.kubernetes.io/name: payments-api, app.kubernetes.io/part-of: klaxon }
spec:
  selector: { app.kubernetes.io/name: payments-api }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
# This Mac's 127.0.0.1:8080, as in compose.yaml (deploy/kind/cluster.yaml maps it to node port 30080).
apiVersion: v1
kind: Service
metadata:
  name: payments-api-host
  namespace: klaxon
  labels: { app.kubernetes.io/name: payments-api, app.kubernetes.io/part-of: klaxon }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: payments-api }
  ports:
    - { name: http, port: 8000, targetPort: 8000, nodePort: 30080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: klaxon
  labels: { app.kubernetes.io/name: payments-api, app.kubernetes.io/part-of: klaxon }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: payments-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payments-api, app.kubernetes.io/part-of: klaxon }
    spec:
      enableServiceLinks: false
      shareProcessNamespace: true # Compose's init: true (see 10-fake-provider.yaml)
      containers:
        - name: payments-api
          image: klaxon-patient:dev
          imagePullPolicy: Never
          args: ["python", "-m", "klaxon.patient.services.payments_api"]
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-lgtm:4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "10000" }
            - { name: OTEL_SEMCONV_STABILITY_OPT_IN, value: "http,database" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: patient-dev-secrets, key: PAYMENTS_API_DATABASE_URL } }
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: PROVIDER_URL, value: "http://fake-provider:8000" }
            - { name: PROVIDER_BREAKER, value: "on" } # the circuit breaker; off is the known-bad old behavior
            - { name: CHARGE_AMOUNT_UNIT, value: cents } # dollars is week 4's money-unit bug: 100 times each charge
            - { name: REFUND_CONNECTION, value: returned } # kept is week 4's connection leak
          ports:
            - { name: http, containerPort: 8000 }
          # compose.yaml's health check (see 10-postgres.yaml for how its timings carry over).
          startupProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
