# The fake provider, as in compose.yaml: our image (built here and loaded into kind, never pulled), its own books on
# a volume of their own. It stands for an outside company, so it gets no telemetry.
apiVersion: v1
kind: Service
metadata:
  name: fake-provider
  namespace: klaxon
  labels: { app.kubernetes.io/name: fake-provider, app.kubernetes.io/part-of: klaxon }
spec:
  selector: { app.kubernetes.io/name: fake-provider }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
# This Mac's 127.0.0.1:8081, as in compose.yaml (deploy/kind/cluster.yaml maps it to node port 30081).
apiVersion: v1
kind: Service
metadata:
  name: fake-provider-host
  namespace: klaxon
  labels: { app.kubernetes.io/name: fake-provider, app.kubernetes.io/part-of: klaxon }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: fake-provider }
  ports:
    - { name: http, port: 8000, targetPort: 8000, nodePort: 30081 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fake-provider
  namespace: klaxon
  labels: { app.kubernetes.io/name: fake-provider, app.kubernetes.io/part-of: klaxon }
spec:
  serviceName: fake-provider
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: fake-provider }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fake-provider, app.kubernetes.io/part-of: klaxon }
    spec:
      enableServiceLinks: false
      # Compose's init: true. The pod's pause process is PID 1 and reaps zombies; the service gets SIGTERM itself.
      shareProcessNamespace: true
      containers:
        - name: fake-provider
          image: klaxon-patient:dev
          imagePullPolicy: Never
          args: ["python", "-m", "klaxon.patient.services.provider_app"]
          env:
            - { name: PROVIDER_DB_PATH, value: /data/provider.sqlite3 }
            - { name: WEBHOOK_URL, value: "http://webhook-receiver:8000/webhooks/provider" }
            - name: WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: patient-dev-secrets, key: PROVIDER_WEBHOOK_SECRET } }
          ports:
            - { name: http, containerPort: 8000 }
          volumeMounts:
            - { name: providerdata, mountPath: /data } # its own volume: the provider's books never share our database
          # compose.yaml's health check (see 10-postgres.yaml for how its timings carry over).
          startupProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: providerdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
