# The data sources of grafana/otel-lgtm:0.34.0, copied from the image
# (/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml), with one change:
# Tempo's "Related logs" searches a minute either side of the span (spanStartTimeShift and
# spanEndTimeShift). Without them it searches only the span's own milliseconds, cut to whole
# milliseconds, and misses a line written in the span's last fraction of a millisecond, which is
# where a consumer logs its outcome. Found 2026-10-13: the confirmer's "confirmed" line was not found.
# The trace_id filter keeps the wider window to this trace's lines.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    editable: true
    jsonData:
      timeInterval: 60s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        customQuery: true
        datasourceUid: "loki"
        query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
        tags:
          - key: "service.name"
            value: "service_name"
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"

      serviceMap:
        datasourceUid: "prometheus"
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: "loki"

  - name: Loki
    type: loki
    uid: loki
    url: http://127.0.0.1:3100
    editable: true
    jsonData:
      derivedFields:
        - name: "trace_id"
          matcherType: "label"
          matcherRegex: "trace_id"
          url: "$${__value.raw}"
          datasourceUid: "tempo"
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    url: http://127.0.0.1:4040
